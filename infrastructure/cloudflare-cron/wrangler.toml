name = "revlet-cron-scheduler"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "7f4b97a2565849ad980c9401fb2fc427"
workers_dev = true

[triggers]
crons = [
  "0 */6 * * *",
  "5 0 * * *",
  "0 2 * * *",
  "*/15 * * * *"
]

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "revlet-mail-backups"

[[r2_buckets]]
binding = "BLOB_BUCKET"
bucket_name = "revlet-mail-blobs"

[vars]
APP_URL = "https://app.revlet.me"
WEBMAIL_URL = "https://mail.revlet.me"
STALWART_URL = "https://mx.revlet.me"
# Encrypted secrets configured via `wrangler secret put`:
#   CRON_SECRET
#   STALWART_ADMIN_USER
#   STALWART_ADMIN_TOKEN
