name = "revlet-cron-scheduler"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "7f4b97a2565849ad980c9401fb2fc427"
workers_dev = true

[triggers]
crons = [
  "0 */6 * * *",
  "5 0 * * *",
  "0 2 * * *",
  "*/15 * * * *"
]

[vars]
APP_URL = "https://app.revlet.me"
WEBMAIL_URL = "https://mail.revlet.me"
# CRON_SECRET is stored as an encrypted Cloudflare Worker secret via `wrangler secret put CRON_SECRET`
