services:
  postgres:
    image: postgres:16-alpine
    container_name: stalwart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stalwart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stalwart
      TZ: UTC
    ports:
      # Bound to localhost on Node 1; bind to WireGuard private IP (10.10.0.1:5432) when adding Node 2+
      - "${CLUSTER_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - /opt/stalwart/pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=250"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=10GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "checkpoint_completion_target=0.9"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stalwart -d stalwart"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: stalwart-valkey
    restart: unless-stopped
    ports:
      # Bound to localhost on Node 1; bind to WireGuard private IP (10.10.0.1:6379) when adding Node 2+
      - "${CLUSTER_BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - /opt/stalwart/valkeydata:/data
    command:
      - "valkey-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${VALKEY_PASSWORD}"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart-mail
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/stalwart/etc:/etc/stalwart
      - /opt/stalwart/data:/var/lib/stalwart
    environment:
      - TZ=UTC
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  caddy:
    image: caddy:2-alpine
    container_name: stalwart-proxy
    restart: unless-stopped
    depends_on:
      - stalwart
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/stalwart/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/stalwart/caddy_data:/data
      - /opt/stalwart/caddy_config:/config
      - /opt/stalwart/logs:/var/log/caddy
